{% extends "base.html" %}

{% block content %}
<div class="container my-4">
    <div class="card shadow-lg p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>{{ quiz.title }}</h2>
            <button id="voice-assistant-btn" class="btn btn-primary" onclick="toggleVoiceAssistant()">
                🎙️ Enable AI Voice Assistant
            </button>
        </div>
        <p class="text-muted" id="voice-status">AI Voice Assistant is idle. Click above to start speaking.</p>

        <form id="quiz-form" action="{{ url_for('submit_quiz', quiz_id=quiz.id) }}" method="POST">
            {% for q in quiz.questions %}
            <div class="question-block mb-4 p-3 border rounded shadow-sm" id="q-block-{{ loop.index }}">
                <h5 class="q-title" data-qindex="{{ loop.index }}">
                    Question {{ loop.index }}: {{ q.question_text }}
                </h5>
                <button type="button" class="btn btn-sm btn-outline-secondary my-2" onclick="speakQuestion({{ loop.index }})">
                    🔊 Read Question
                </button>
                <div class="form-check my-2">
                    <input class="form-check-input" type="radio" name="question_{{ q.id }}" value="A" id="q{{ q.id }}_a">
                    <label class="form-check-label" for="q{{ q.id }}_a">A) {{ q.option_a }}</label>
                </div>
                <div class="form-check my-2">
                    <input class="form-check-input" type="radio" name="question_{{ q.id }}" value="B" id="q{{ q.id }}_b">
                    <label class="form-check-label" for="q{{ q.id }}_b">B) {{ q.option_b }}</label>
                </div>
                <div class="form-check my-2">
                    <input class="form-check-input" type="radio" name="question_{{ q.id }}" value="C" id="q{{ q.id }}_c">
                    <label class="form-check-label" for="q{{ q.id }}_c">C) {{ q.option_c }}</label>
                </div>
                <div class="form-check my-2">
                    <input class="form-check-input" type="radio" name="question_{{ q.id }}" value="D" id="q{{ q.id }}_d">
                    <label class="form-check-label" for="q{{ q.id }}_d">D) {{ q.option_d }}</label>
                </div>
            </div>
            {% endfor %}

            <button type="submit" class="btn btn-success btn-lg w-100 mt-3">Submit Quiz Answers</button>
        </form>
    </div>
</div>

<script>
const synth = window.speechSynthesis;
let recognition;

if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.lang = 'en-US';

    recognition.onresult = function(event) {
        const transcript = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
        document.getElementById('voice-status').innerText = `Heard Voice Command: "${transcript}"`;
        
        if (transcript.includes('option a') || transcript.includes('select a')) selectOption('A');
        else if (transcript.includes('option b') || transcript.includes('select b')) selectOption('B');
        else if (transcript.includes('option c') || transcript.includes('select c')) selectOption('C');
        else if (transcript.includes('option d') || transcript.includes('select d')) selectOption('D');
        else if (transcript.includes('submit')) document.getElementById('quiz-form').submit();
    };
}

function speakQuestion(index) {
    const qBlock = document.getElementById(`q-block-${index}`);
    if (qBlock) {
        const text = qBlock.innerText.replace("🔊 Read Question", "");
        const utterance = new SpeechSynthesisUtterance(text);
        synth.speak(utterance);
    }
}

function toggleVoiceAssistant() {
    if (recognition) {
        try {
            recognition.start();
            document.getElementById('voice-status').innerText = "Listening... Say 'Option A', 'Option B', 'Option C', 'Option D', or 'Submit'.";
        } catch (e) {
            recognition.stop();
            document.getElementById('voice-status').innerText = "Voice Assistant stopped.";
        }
    } else {
        alert("Speech Recognition is not supported on this web browser.");
    }
}

function selectOption(opt) {
    const radios = document.querySelectorAll('.form-check-input');
    if (radios.length > 0) {
        radios.forEach(radio => {
            if (radio.value === opt) radio.checked = true;
        });
    }
}
</script>
{% endblock %}
