{% extends 'base.html' %}
{% block title %}Add Question{% endblock %}
{% block content %}
<div class="form-card">
    <h2>Add Question to "{{ quiz.title }}"</h2>
    <p class="muted">{{ quiz.questions|length }} question(s) added so far.</p>
    <form method="POST">
        <label>Question</label>
        <textarea name="question_text" rows="2" required></textarea>

        <label>Option A</label>
        <input type="text" name="option_a" required>
        <label>Option B</label>
        <input type="text" name="option_b" required>
        <label>Option C</label>
        <input type="text" name="option_c" required>
        <label>Option D</label>
        <input type="text" name="option_d" required>

        <label>Correct Option</label>
        <select name="correct_option">
            <option value="a">A</option>
            <option value="b">B</option>
            <option value="c">C</option>
            <option value="d">D</option>
        </select>

        <button class="btn btn-primary" type="submit">Add Question</button>
    </form>
    <a href="{{ url_for('view_course', course_id=quiz.course_id) }}">Done adding questions &rarr;</a>
</div>
{% endblock %}
