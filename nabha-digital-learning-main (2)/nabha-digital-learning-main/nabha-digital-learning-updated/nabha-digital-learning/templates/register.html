{% extends "base.html" %}

{% block content %}
<div class="container my-5" style="max-width: 500px;">
    <div class="card shadow-lg p-4 border-0 rounded-3">
        <h2 class="text-center mb-4">Create an Account</h2>
        
        <form method="POST" action="{{ url_for('register') }}">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" autocomplete="username" placeholder="Enter your username" required>
            </div>
            
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" name="email" autocomplete="email" placeholder="Enter your email" required>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" placeholder="Create a password" required>
            </div>

            <div class="mb-3">
                <label for="role" class="form-label">Account Role</label>
                <select class="form-select" id="role" name="role">
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2">Register</button>
        </form>
        
        <div class="text-center mt-3">
            <p class="text-muted">Already have an account? <a href="{{ url_for('login') }}">Log in here</a></p>
        </div>
    </div>
</div>
{% endblock %}
