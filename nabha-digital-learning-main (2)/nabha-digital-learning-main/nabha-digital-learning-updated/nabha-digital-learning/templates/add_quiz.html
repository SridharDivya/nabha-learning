{% extends 'base.html' %}
{% block title %}Add Quiz{% endblock %}
{% block content %}
<div class="form-card">
    <h2>Create Quiz for "{{ course.title }}"</h2>
    <form method="POST">
        <label>Quiz Title</label>
        <input type="text" name="title" required>
        <button class="btn btn-primary" type="submit">Create Quiz</button>
    </form>
</div>
{% endblock %}
