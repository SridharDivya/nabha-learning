{% extends 'base.html' %}
{% block title %}Quiz Result{% endblock %}
{% block content %}
<div class="form-card">
    <h2>Your Score</h2>
    <p class="score">{{ score }} / {{ total }}</p>
    <a class="btn btn-primary" href="{{ url_for('view_course', course_id=course.id) }}">Back to {{ course.title }}</a>
</div>
{% endblock %}
