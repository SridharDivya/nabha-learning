{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'home' %}<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>
{%- elif name == 'calendar' %}<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
{%- elif name == 'check' %}<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>
{%- elif name == 'bot' %}<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4M9 13.5h.01M15 13.5h.01M9.5 17h5"/>
{%- elif name == 'users' %}<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.4 2.9-6 6.5-6s6.5 2.6 6.5 6"/><path d="M16 4.6a3.5 3.5 0 010 6.8M18 14.2c2.2.7 3.5 2.7 3.5 5.8"/>
{%- elif name == 'book' %}<path d="M4 4h6a3 3 0 013 3v13a2 2 0 00-2-2H4z"/><path d="M20 4h-6a3 3 0 00-3 3v13a2 2 0 012-2h7z"/>
{%- elif name == 'chart' %}<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
{%- elif name == 'quiz' %}<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 11l2 2 4-4M9 17h6"/>
{%- elif name == 'logout' %}<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
{%- elif name == 'menu' %}<path d="M3 6h18M3 12h18M3 18h18"/>
{%- elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == 'cap' %}<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5"/>
{%- elif name == 'layers' %}<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>
{%- endif %}
</svg>
{%- endmacro %}
