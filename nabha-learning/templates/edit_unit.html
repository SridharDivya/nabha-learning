{% extends 'base.html' %}
{% block title %}Edit lesson{% endblock %}
{% block content %}
<div class="breadcrumb"><a href="{{ url_for('teacher_subject', subject_id=unit.subject_id) }}">← Back to {{ unit.subject.title }}</a></div>
<div class="form-card" style="max-width:none">
    <h2 style="margin-top:0">Edit Unit {{ unit.unit_number }}</h2>
    <form method="POST">
        <label for="title">Lesson title</label>
        <input id="title" type="text" name="title" value="{{ unit.title }}" required maxlength="150">
        <label for="content">Lesson content</label>
        <textarea id="content" name="content" rows="12">{{ unit.content or '' }}</textarea>
        <label for="video_url">Video link (optional)</label>
        <input id="video_url" type="url" name="video_url" value="{{ unit.video_url or '' }}">
        <button class="btn btn-primary" type="submit">Save changes</button>
    </form>
</div>
{% endblock %}
